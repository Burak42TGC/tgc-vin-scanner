<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>TGC Live Barcode Scanner v14</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#181c23;--text:#f4f6f8;--muted:#a9b0ba;--line:#2a3039;--accent:#2f80ed;--ok:#1fa971;--bad:#d94b4b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#242a33;font-size:12px;margin-bottom:10px}
.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:700;margin-top:10px}
.primary{background:var(--accent);color:#fff}
.secondary{background:#242a33;color:#fff}
.camera{position:relative;margin-top:14px;border-radius:16px;overflow:hidden;background:#000;border:1px solid #333b46}
video{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#000}
.frame{position:absolute;left:5%;right:5%;top:38%;height:16%;border:3px solid #2ed573;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.38);pointer-events:none}
.line{position:absolute;left:7%;right:7%;top:46%;height:2px;background:#2ed573;box-shadow:0 0 12px #2ed573;pointer-events:none}
.hint{position:absolute;left:10px;right:10px;bottom:14px;background:rgba(0,0,0,.72);padding:9px 10px;border-radius:10px;font-size:13px;text-align:center}
.status{margin-top:12px;padding:12px;border-radius:12px;background:#11151b;border:1px solid var(--line);font-size:14px;line-height:1.4}
.good{border-color:var(--ok);color:#b9f5dc}
.bad{border-color:var(--bad);color:#ffc0c0}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#11151b;color:#fff;font-size:17px}
.hidden{display:none}
.result{margin-top:10px;padding:13px;border-radius:12px;border:1px solid var(--ok);background:rgba(31,169,113,.12);font-weight:800;letter-spacing:.5px}
</style>
</head>
<body>
<div class="app">
  <h1>TGC Live Barcode Scanner</h1>
  <div class="sub">Testversion v14 · kein Foto nötig</div>

  <div class="card">
    <span class="badge">TGC Barcode Live</span>
    <div>Einmal starten, dann Barcode nur ins grüne Feld halten. Bei Treffer wird die VIN automatisch übernommen.</div>

    <button id="startBtn" class="btn primary" type="button">▥ Barcode-Scanner starten</button>
    <button id="stopBtn" class="btn secondary" type="button">⏹ Scanner stoppen</button>

    <div id="camera" class="camera hidden">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div class="line"></div>
      <div class="hint">TGC-Barcode waagerecht und möglichst groß ins grüne Feld halten</div>
    </div>

    <div id="status" class="status">Scanner noch nicht gestartet.</div>
    <div id="result" class="result hidden"></div>

    <label>VIN / FIN</label>
    <input id="vin" maxlength="17" placeholder="wird automatisch eingetragen">
  </div>
</div>

<script>
let reader=null;
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const resultEl=document.getElementById('result');
const vinEl=document.getElementById('vin');
const cameraEl=document.getElementById('camera');

function status(text,type=''){
  statusEl.className='status'+(type?' '+type:'');
  statusEl.textContent=text;
}

function extractVin(text){
  const raw=(text||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(raw.length===17 && /^[A-HJ-NPR-Z0-9]{17}$/.test(raw)) return raw;
  const m=raw.match(/[A-HJ-NPR-Z0-9]{17}/);
  return m ? m[0] : null;
}

async function startScanner(){
  try{
    if(typeof ZXing==='undefined'){
      status('Barcode-Bibliothek wurde nicht geladen. Seite bitte neu öffnen.','bad');
      return;
    }

    stopScanner(false);
    cameraEl.classList.remove('hidden');
    status('Kamera startet …');

    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.QR_CODE
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);

    reader=new ZXing.BrowserMultiFormatReader(hints);

    await reader.decodeFromVideoDevice(undefined,video,(result,err)=>{
      if(!result) return;

      const text=result.getText();
      const vin=extractVin(text);

      if(vin){
        vinEl.value=vin;
        resultEl.textContent='✅ TGC-Barcode erkannt: '+vin;
        resultEl.classList.remove('hidden');
        status('Barcode erfolgreich gelesen. VIN automatisch eingetragen.','good');
        if(navigator.vibrate) navigator.vibrate([100,50,100]);
        stopScanner(true);
      }else{
        status('Barcode gelesen, aber keine 17-stellige VIN gefunden: '+text,'bad');
      }
    });

    status('Scanner aktiv – Barcode jetzt ins grüne Feld halten.');
  }catch(e){
    status('Scanner konnte nicht gestartet werden: '+(e && e.message ? e.message : 'unbekannt'),'bad');
  }
}

function stopScanner(keepStatus=false){
  try{
    if(reader) reader.reset();
  }catch(e){}
  reader=null;
  video.srcObject=null;
  cameraEl.classList.add('hidden');
  if(!keepStatus) status('Scanner gestoppt.');
}

document.getElementById('startBtn').addEventListener('click',startScanner);
document.getElementById('stopBtn').addEventListener('click',()=>stopScanner(false));
window.addEventListener('pagehide',()=>stopScanner(true));
</script>
</body>
</html>
